backend = "xrender";
vsync = false;

# Shadow
shadow = false;
shadow-radius = 15;
shadow-opacity = 0.4;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-exclude = [
  "window_type = 'dock'",
  "class_g = 'dunst'"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;

# Rounded Corners
corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Opacity
inactive-opacity = 1;
active-opacity = 1;
frame-opacity = 1;
